server:
  port: 8080
  baseURL: "/"
  logging:
    - levels: "info|warning|error"
  sources:
    # Change this line
    - path: "E:/PERSONAL/PHOTOS"
userDefaults:
  preview:
    image: true
    popup: true
    video: false
    office: false
    highQuality: false
  darkMode: true
  disableSettings: false
  singleClick: false
  permissions:
    admin: false
    modify: false
    share: false
    api: false